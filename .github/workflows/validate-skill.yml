name: Validate Skill Structure & Markdown Links

on:
  push:
    paths:
      - 'SKILL.md'
      - 'docs/**'
      - 'references/**'
      - 'workflows/**'
      - 'schemas/**'
      - 'templates/**'
      - 'scripts/**'
  pull_request:

jobs:
  structure-check:
    name: Verify Skill Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Structural Verification
        run: |
          python scripts/check_skill.py .
