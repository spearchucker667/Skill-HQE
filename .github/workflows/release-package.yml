name: Release Package

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify-release:
    name: Build and Verify Release ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build release package
        run: |
          python scripts/package_skill.py --source . --output skill-release.zip

      - name: Validate release contents
        run: |
          python scripts/check_release_contents.py skill-release.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: skill-release
          path: skill-release.zip
          if-no-files-found: error
